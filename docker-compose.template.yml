services:
  # postgres — DATABASE_PORT in ports is rewritten by scripts/initialize-workspace.sh
  postgres:
    image: postgres:16
    ports:
      - "DATABASE_PORT:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  # minio — MINIO_API_PORT / MINIO_CONSOLE_PORT in ports are rewritten by scripts/initialize-workspace.sh
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "MINIO_API_PORT:9000"
      - "MINIO_CONSOLE_PORT:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  # mailhog — MAILHOG_SMTP_PORT / MAILHOG_UI_PORT in ports are rewritten by scripts/initialize-workspace.sh
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "MAILHOG_SMTP_PORT:1025"
      - "MAILHOG_UI_PORT:8025"
